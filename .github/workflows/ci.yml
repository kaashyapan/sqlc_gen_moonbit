name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: testdb
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -pmysql"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl just postgresql-client mysql-client libsqlite3-dev pkg-config sqlite3

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install MoonBit CLI
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Moon update
        run: |
          moon update
          # Update test project dependencies
          cd tests/sqlite_native && rm -rf .mooncakes && moon update
          cd ../sqlite_js && rm -rf .mooncakes && moon update
          cd ../d1 && moon update

      - name: Install D1 test dependencies
        run: cd tests/d1 && npm ci

      - name: Run core tests
        run: just --justfile .justfile test-core-ci

      - name: Setup PostgreSQL schema
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d testdb -c "
          CREATE TABLE IF NOT EXISTS users (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              email VARCHAR(255) UNIQUE NOT NULL,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
          );
          CREATE TABLE IF NOT EXISTS test_users (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              bigserial_var BIGSERIAL,
              int64_var BIGINT,
              pg_int8_var INT8,
              int_var INT4,
              bool_var BOOL,
              uuid_var uuid,
              date_var date,
              timestampz_var TIMESTAMPTZ,
              timestamp_var TIMESTAMP,
              time_var time,
              int2_var INT2,
              smallint_var INT2,
              interval_var INTERVAL,
              timetz_var TIMETZ,
              json_var JSON,
              jsonb_var JSONB,
              bytes_var BYTEA,
              float_var float4,
              double_var float8,
              numeric_var numeric
          );

          CREATE TABLE IF NOT EXISTS test_users_not_null (
              id SERIAL PRIMARY KEY,
              name VARCHAR(255) NOT NULL,
              bigserial_var BIGSERIAL NOT NULL,
              int64_var BIGINT NOT NULL,
              pg_int8_var INT8 NOT NULL,
              int_var INT4 NOT NULL,
              bool_var BOOL NOT NULL,
              uuid_var uuid NOT NULL,
              date_var date NOT NULL,
              timestampz_var TIMESTAMPTZ NOT NULL,
              timestamp_var TIMESTAMP NOT NULL,
              time_var time NOT NULL,
              int2_var INT2 NOT NULL,
              smallint_var INT2 NOT NULL,
              interval_var INTERVAL NOT NULL,
              timetz_var TIMETZ NOT NULL,
              json_var JSON NOT NULL,
              jsonb_var JSONB NOT NULL,
              bytes_var BYTEA NOT NULL,
              float_var REAL NOT NULL,
              double_var float8 NOT NULL,
              numeric_var numeric NOT NULL
          );
          "

      - name: Setup MySQL schema
        run: |
          mysql -h 127.0.0.1 -uroot -pmysql testdb -e "
            CREATE TABLE IF NOT EXISTS users (
              id BIGINT PRIMARY KEY AUTO_INCREMENT,
              name VARCHAR(255) NOT NULL,
              email VARCHAR(255) NOT NULL UNIQUE,
              created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
            );
          "

      - name: Install postgres_js dependencies
        run: cd examples/postgres_js && npm ci

      - name: Install mysql_js dependencies
        run: cd examples/mysql_js && npm ci

      - name: Run postgres_js test
        run: just --justfile .justfile test-postgres-js

      - name: Run mysql_js test
        run: just --justfile .justfile test-mysql-js

      - name: Run postgres_native test
        run: just --justfile .justfile test-pg
